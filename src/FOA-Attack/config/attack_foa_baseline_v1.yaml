defaults:
  - pipeline_common_v1
  - _self_
stage: attack
experiment:
  name: attack_foa_baseline_v1
  method: foa_baseline
  cluster_number: 10
data:
  batch_size: 1
  num_samples: 100
  cle_data_path: /kaggle/input/foa-images/source
  tgt_data_path: /kaggle/input/foa-images/target
optim:
  alpha: 1.0
  epsilon: 16
  steps: 300
model:
  input_res: 224
  use_source_crop: true
  use_target_crop: true
  crop_scale: [0.5, 0.9]
  ensemble: true
  device: cuda:0
  backbone: [B16, B32, Laion]
wandb:
  project: foa_versioned
attack: fgsm
environment:
  name: attack_v1
  packages:
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - PyYAML==6.0.2
    - wandb==0.19.1
    - tenacity==9.0.0
    - transformers==4.49.0
    - pytorch-lightning==2.5.0.post0
    - numba==0.61.2
    - kmeans-pytorch @ git+https://github.com/subhadarship/kmeans_pytorch.git@f7f36bd1cb4e3a761d73d584866d0a9c6b4d2805
